<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Lily The Cat</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fef6ff;
  text-align: center;
}
#logo {
  font-size: 40px;
}
#ball {
  font-size: 30px;
}
input, button {
  padding: 10px;
  font-size: 16px;
}
#chat {
  margin-top: 20px;
}
</style>
</head>

<body>

<div id="logo">🐱 Lily The Cat</div>
<div id="ball">🧶</div>
<h3>Lily Search</h3>

<input id="question" placeholder="Bir şey sor..." />
<button onclick="ask()">Sor</button>

<div id="chat"></div>

<script>
// HAFIZA
let memory = JSON.parse(localStorage.getItem("lilyMemory")) || {
  elma: {
    renkler: ["kırmızı", "yeşil"],
    neden: "İçindeki doğal pigmentler nedeniyle"
  }
};

// CÜMLE TEMİZLEME
function clean(text) {
  return text
    .toLowerCase()
    .replace(/nedir|ne|mi|mı|mu|mü|neden|niçin|\?/g, "")
    .trim();
}

// ANA FONKSİYON
function ask() {
  let q = document.getElementById("question").value;
  let cleanQ = clean(q);
  let chat = document.getElementById("chat");

  for (let konu in memory) {
    if (cleanQ.includes(konu)) {

      // NEDEN?
      if (q.toLowerCase().includes("neden")) {
        chat.innerHTML = `<p><b>Lily:</b> ${konu} ${memory[konu].neden}.</p>`;
        return;
      }

      // RENK
      if (cleanQ.includes("renk")) {
        let renkler = memory[konu].renkler.join(" ve ");
        chat.innerHTML = `<p><b>Lily:</b> ${konu} genelde ${renkler} olur.</p>`;
        return;
      }

      // GENEL
      chat.innerHTML = `<p><b>Lily:</b> ${konu} hakkında bildiklerim var 😊</p>`;
      return;
    }
  }

  // ÖĞRENME
  chat.innerHTML = `
  <p><b>Lily:</b> Bunu bilmiyorum. Bana öğretmek ister misin?</p>
  <input id="teach" placeholder="Cevabı yaz">
  <button onclick="learn('${cleanQ}')">Öğret</button>`;
}

// ÖĞRENME
function learn(q) {
  let answer = document.getElementById("teach").value;
  let konu = q.split(" ")[0];

  memory[konu] = {
    renkler: [answer],
    neden: "Bunu insanlar öğretti"
  };

  localStorage.setItem("lilyMemory", JSON.stringify(memory));
  document.getElementById("chat").innerHTML =
    "<p><b>Lily:</b> Öğrendim! 🐱🧠</p>";
}
</script>

</body>
</html>
