<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Lily The Cat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    input {
      padding: 10px;
      width: 60%;
      font-size: 16px;
      border-radius: 10px;
      border: none;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      margin-left: 10px;
      background: pink;
      cursor: pointer;
    }
    #cevap {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>🐱 Lily The Cat</h1>
  <p>Kendi kendine öğrenen yapay zeka</p>

  <input id="soru" placeholder="Lily'ye bir şey sor..." />
  <button onclick="sor()">Sor</button>

  <div id="cevap"></div>

  <script>
    const bilgiler = {
      "elma ne renk": "Elma kırmızıdır 🍎",
      "muz ne renk": "Muz sarıdır 🍌",
      "sen kimsin": "Ben Lily The Cat 🐱"
    };

    function sor() {
      const soru = document.getElementById("soru").value.toLowerCase();
      const cevapDiv = document.getElementById("cevap");

      if (bilgiler[soru]) {
        cevapDiv.innerText = bilgiler[soru];
      } else {
        cevapDiv.innerText = "Bu konu hakkında henüz bilgim yok 😿";
      }
    }
  </script>

</body>
</html>
