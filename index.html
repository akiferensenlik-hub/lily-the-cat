<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Lily The Cat</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f5ff;
  text-align:center;
  padding:30px;
}

.cat{
  font-size:90px;
}

.yarn{
  font-size:40px;
  margin-top:-20px;
}

h1{
  margin:10px 0 5px;
}

input{
  padding:10px;
  width:70%;
  max-width:300px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:10px 16px;
  margin-left:5px;
  border:none;
  border-radius:8px;
  background:pink;
  cursor:pointer;
}

#res{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<div class="cat">🐱</div>
<div class="yarn">🧶</div>

<h1>Lily The Cat</h1>
<p>Kendi kendine öğreniyor 🧠</p>

<input id="q" placeholder="Lily'ye bir şey sor...">
<button onclick="ask()">Sor</button>

<div id="res"></div>

<script>
let memory = JSON.parse(localStorage.getItem("lilyMemory")) || {
  "elma ne renk": "🍎 Elma genellikle kırmızıdır",
  "muz ne renk": "🍌 Muz sarıdır",
  "merhaba": "Merhaba! 🐱",
  "nasılsın": "İyiyim, mır mır 😸"
};

function ask(){
  let q = document.getElementById("q").value.toLowerCase().trim();
  let res = document.getElementById("res");

  if(memory[q]){
    res.innerText = memory[q];
  }else{
    res.innerText = "Bunu bilmiyorum 😿 Bana öğret: soru = cevap";
  }
}

// Öğretme sistemi
document.getElementById("q").addEventListener("change", ()=>{
  let text = document.getElementById("q").value;
  if(text.includes("=")){
    let parts = text.split("=");
    let soru = parts[0].toLowerCase().trim();
    let cevap = parts[1].trim();

    memory[soru] = cevap;
    localStorage.setItem("lilyMemory", JSON.stringify(memory));

    document.getElementById("res").innerText = "Öğrendim! 🧠🐾";
    document.getElementById("q").value = "";
  }
});
</script>

</body>
</html>
